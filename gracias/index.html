<!DOCTYPE html>
<html lang="es-UY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta recibida | ADONAI ELECTRICAL</title>
  <meta name="description" content="Confirmación de recepción de una solicitud de cotización enviada a ADONAI ELECTRICAL.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('adonai-theme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme || systemTheme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/service-page.js" defer></script>
</head>
<body class="service-page-body confirmation-page">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="service-page-header">
    <div class="container service-page-header__inner">
      <a class="service-page-brand" href="/" aria-label="ADONAI ELECTRICAL, volver al inicio"><img src="/logo-mark-92.webp" alt="" width="46" height="46"><span class="brand-name">ADONAI ELECTRICAL</span></a>
      <div class="service-page-header__actions">
        <button class="header-tool theme-toggle service-page-theme-toggle" id="service-theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false" title="Cambiar modo de color">
          <svg class="icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg class="icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="tool-label">Modo claro u oscuro</span>
        </button>
        <a class="btn btn--dark" href="/">Volver al inicio</a>
      </div>
    </div>
  </header>
  <main class="confirmation-main" id="contenido">
    <div class="container">
      <section class="confirmation-card" aria-labelledby="confirmation-title">
        <span class="confirmation-icon" aria-hidden="true">✓</span>
        <p class="eyebrow">Solicitud enviada</p>
        <h1 id="confirmation-title">Recibimos tu consulta.</h1>
        <p class="confirmation-card__lead">Te enviamos una confirmación al correo que ingresaste. Revisaremos la información y nos comunicaremos contigo para coordinar los próximos pasos.</p>
        <div class="confirmation-card__actions">
          <a class="btn btn--dark" href="/">Volver al inicio</a>
          <a class="btn confirmation-card__whatsapp" href="https://wa.me/59898152423?text=Hola%20ADONAI%20ELECTRICAL%2C%20acabo%20de%20enviar%20una%20solicitud%20desde%20la%20web." target="_blank" rel="noopener noreferrer">Continuar por WhatsApp</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
